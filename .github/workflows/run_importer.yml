name: GTFS Import Pipeline

on:
  schedule:
    # Two bounded runs/day preserve both D1 read/write and Actions headroom.
    - cron: "0 */12 * * *"
  workflow_dispatch:
    inputs:
      max_rows:
        description: Logical-row cap for this manual run (keep daily D1 write headroom)
        required: true
        default: "1000"
        type: choice
        options:
          - "1000"
          - "2000"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NODE_OPTIONS: "--no-deprecation"

# Ensure only one import runs at a time to prevent D1 database state corruption
concurrency:
  group: gtfs-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10 # Fail-safe to prevent runaways from consuming free tier minutes
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Pre-built Importer
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download latest-cron -p importer -O importer_bin --clobber
          chmod +x importer_bin

      - name: Run Importer
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CSV_CONCURRENCY_LIMIT: ${{ vars.CSV_CONCURRENCY_LIMIT || '2' }}
          D1_CONCURRENCY_LIMIT: ${{ vars.D1_CONCURRENCY_LIMIT || '6' }}
          D1_DATABASE_CONCURRENCY_LIMIT: ${{ vars.D1_DATABASE_CONCURRENCY_LIMIT || '1' }}
          D1_MAX_DATABASES: ${{ vars.D1_MAX_DATABASES || '10' }}
          D1_STATEMENTS_PER_REQUEST: ${{ vars.D1_STATEMENTS_PER_REQUEST || '4' }}
          MAX_D1_ROWS_WRITTEN_PER_WORKFLOW: ${{ vars.MAX_D1_ROWS_WRITTEN_PER_WORKFLOW || '40000' }}
          MAX_ROWS_PER_WORKFLOW: ${{ github.event_name == 'workflow_dispatch' && inputs.max_rows || vars.MAX_ROWS_PER_WORKFLOW || '1750000' }}
          MAX_FEED_DOWNLOAD_MB: ${{ vars.MAX_FEED_DOWNLOAD_MB || '256' }}
          MAX_UNCOMPRESSED_FEED_MB: ${{ vars.MAX_UNCOMPRESSED_FEED_MB || '512' }}
          MAX_CSV_RECORD_KB: ${{ vars.MAX_CSV_RECORD_KB || '512' }}
          MAX_STATEMENT_PAYLOAD_KB: ${{ vars.MAX_STATEMENT_PAYLOAD_KB || '1536' }}
          MAX_TEMP_FEED_STORAGE_MB: ${{ vars.MAX_TEMP_FEED_STORAGE_MB || '2048' }}
          QUERY_STATEMENT_BATCH_SIZE: ${{ vars.QUERY_STATEMENT_BATCH_SIZE || '1000' }}
          DB_SIZE_THRESHOLD_MB: ${{ vars.DB_SIZE_THRESHOLD_MB || '400' }}
        run: ./importer_bin

      - name: Auto-Commit and Redeploy on Rotation
        if: always()
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if ! git diff --quiet providers.toml; then
            echo "Database rotation detected. Committing changes..."
            bash ./scripts/generate-wrangler.sh
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add providers.toml wrangler.toml
            git commit -m "chore: auto-rotate D1 databases"
            git push

            echo "Deploying updated worker..."
            npm ci
            npx wrangler deploy
          else
            echo "No database rotation occurred."
          fi
