name: Build Importer

on:
  push:
    branches:
      - main
    paths:
      - "importer/**"
      - "migrations/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain"
      - ".github/workflows/build_importer.yml"
      - "providers.toml"
      - "worker/**"
      - "test/**"
      - "scripts/build.sh"
  pull_request:
    paths:
      - "importer/**"
      - "worker/**"
      - "migrations/**"
      - "test/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain"
      - "scripts/build.sh"
      - ".github/workflows/build_importer.yml"
      - "providers.toml"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NODE_OPTIONS: "--no-deprecation"

concurrency:
  group: build-importer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # Needed for creating a GitHub release

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.0
          components: clippy, rustfmt

      - name: Cache Rust Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check Formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run Unit Tests
        run: cargo test --workspace --locked

      - name: Validate Live GTFS Schemas
        run: python3 test/verify_migrations.py --no-report

      - name: Run JSON Payload Benchmark Guard
        run: python3 test/benchmark_json_payload.py

      - name: Run UPSERT Replay Benchmark Guard
        run: python3 test/benchmark_upsert_replay.py

      - name: Run Resume Checkpoint Benchmark Guard
        run: cargo bench -p importer --bench resume_checkpoint --locked

      - name: Build Worker
        run: bash ./scripts/build.sh

      - name: Build Importer
        run: cargo build --release --locked -p importer

      - name: Publish to GitHub Release
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Create a rolling 'latest-cron' tag and release
          # Using gh cli which is pre-installed on ubuntu runners

          # Delete the release and tag if they exist locally and remotely
          if gh release view latest-cron >/dev/null 2>&1; then
            gh release delete latest-cron -y --cleanup-tag
          fi

          # Create the release and upload the binary
          gh release create latest-cron target/release/importer \
            --title "Latest Importer Build" \
            --notes "Automated build from commit ${{ github.sha }} for the cron pipeline." \
            --latest
