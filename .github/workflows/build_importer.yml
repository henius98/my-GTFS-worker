name: Build Importer

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build_importer.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain"
      - "rustfmt.toml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "providers.toml"
      - "wrangler.toml"
      - "importer/**"
      - "worker/**"
      - "migrations/**"
      - "test/**"
      - "scripts/build.sh"
      - "scripts/generate-wrangler.sh"
      - "scripts/local-d1-importer.mjs"
      - "scripts/schema_parser.rs"
  pull_request:
    paths:
      - ".github/workflows/build_importer.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain"
      - "rustfmt.toml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "providers.toml"
      - "wrangler.toml"
      - "importer/**"
      - "worker/**"
      - "migrations/**"
      - "test/**"
      - "scripts/build.sh"
      - "scripts/generate-wrangler.sh"
      - "scripts/local-d1-importer.mjs"
      - "scripts/schema_parser.rs"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NODE_OPTIONS: "--no-deprecation"

concurrency:
  group: build-importer-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install Node Dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.100.0
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown

      - name: Cache Rust Dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Regenerate wrangler.toml from providers.toml
        run: |
          bash ./scripts/generate-wrangler.sh
          if ! git diff --quiet wrangler.toml; then
            echo "wrangler.toml is out of date with providers.toml; regenerated."
            if [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git add wrangler.toml
              git commit -m "chore: regenerate wrangler.toml from providers.toml"
              git push
            fi
          fi

      - name: Verify All Tests Live Under test/
        run: |
          python3 - << 'EOF'
          from pathlib import Path
          import re, sys

          repo = Path.cwd().resolve()
          test_root = repo / "test"
          errors = []
          referenced_unit_tests = set()

          for forbidden in ("importer/tests", "importer/benches", "worker/tests", "worker/benches"):
            if Path(forbidden).exists():
              errors.append(f"{forbidden}: test/bench directory outside test/")

          for root in ("importer", "worker", "scripts"):
            for path in sorted(Path(root).rglob("*.rs")):
              lines = path.read_text().splitlines()
              for idx, line in enumerate(lines):
                stripped = line.strip()
                if stripped.startswith("//"):
                  continue
                if re.search(r"#\[(?:[\w:]+::)*test(?:\s*\([^)]*\))?\]", stripped):
                  errors.append(f"{path}:{idx + 1}: test attribute outside test/")
                if re.match(r"^(?:pub(?:\([^)]*\))?\s+)?mod\s+tests\s*\{", stripped):
                  errors.append(f"{path}:{idx + 1}: inline mod tests block outside test/")
                if re.search(r"#\[cfg(?:_attr)?\([^]]*\btest\b", stripped):
                  next_1 = lines[idx + 1].strip() if idx + 1 < len(lines) else ""
                  next_2 = lines[idx + 2].strip() if idx + 2 < len(lines) else ""
                  path_match = re.match(r'^#\[path\s*=\s*"((?:\.\./)+test/[^"]+)"\]$', next_1)
                  if stripped == "#[cfg(test)]" and path_match and re.match(r"^(?:pub\(crate\)\s+)?mod\s+tests;$", next_2):
                    target = (path.parent / path_match.group(1)).resolve()
                    if not target.is_file() or not target.is_relative_to(test_root):
                      errors.append(f"{path}:{idx + 2}: stub target missing or outside test/: {next_1}")
                    else:
                      referenced_unit_tests.add(target)
                  else:
                    errors.append(f"{path}:{idx + 1}: non-stub #[cfg(test)] item outside test/")

          for unit_file in sorted((test_root / "unit").rglob("*.rs")):
            if unit_file.resolve() not in referenced_unit_tests:
              errors.append(f"{unit_file.relative_to(repo)}: unreferenced unit test file")

          if errors:
            print("\n".join(errors), file=sys.stderr)
            sys.exit(1)
          EOF

      - name: Check Formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run Unit and SQL Tests
        run: cargo test --workspace --locked

      - name: Validate Live GTFS Schemas
        run: cargo run --locked -p gtfs-checks --bin verify_migrations -- --no-report

      - name: Run JSON Payload Benchmark Guard
        run: cargo run --locked -p gtfs-checks --bin benchmark_json_payload

      - name: Run UPSERT Replay Benchmark Guard
        run: cargo run --locked -p gtfs-checks --bin benchmark_upsert_replay

      - name: Build Worker
        run: bash ./scripts/build.sh

      - name: Run Worker Integration Tests
        run: node --test test/worker/*.test.mjs

      - name: Run Local D1 Importer Integration Tests
        run: node --test test/importer/local_d1.test.mjs

      - name: Build Importer
        run: cargo build --release --locked -p importer

      - name: Transfer Importer to Release Job
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: target/release/importer
          archive: false
          if-no-files-found: error
          retention-days: 1

  publish:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # Needed only for creating the GitHub release

    steps:
      - name: Download Importer
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: importer

      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TARGET: ${{ github.sha }}
        run: |
          # Create a rolling 'latest-cron' tag and release
          # Using gh cli which is pre-installed on ubuntu runners

          # Delete the release and tag if they exist locally and remotely
          if gh release view latest-cron >/dev/null 2>&1; then
            gh release delete latest-cron -y --cleanup-tag
          fi

          # Create the release and upload the binary
          gh release create latest-cron importer \
            --title "Latest Importer Build" \
            --notes "Automated build from commit ${RELEASE_TARGET} for the cron pipeline." \
            --target "${RELEASE_TARGET}" \
            --latest
