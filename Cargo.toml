[workspace]
members = ["worker", "importer"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["henius"]

[workspace.dependencies]
worker = { version = "0.8.3", features = ["d1"] }
console_error_panic_hook = "0.1.7"
serde = { version = "1.0.215", features = ["derive"] }
serde_json = "1.0.133"
thiserror = "1.0.69"
chrono = "0.4.38"
reqwest = { version = "0.11.27", features = ["json"] }
tokio = { version = "1.41.1", features = ["fs", "io-util", "macros", "rt-multi-thread", "sync", "time"] }
toml = "0.8.19"
zip = { version = "8.2.2", default-features = false, features = ["deflate-flate2-zlib-rs"] }
csv = "1.3.1"

[profile.release]
lto = "fat"
opt-level = 3
codegen-units = 1
panic = "abort"
strip = true

[profile.worker-release]
inherits = "release"
opt-level = "s"
strip = false

[profile.dev.package."*"]
opt-level = 3

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
