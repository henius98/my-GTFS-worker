[workspace]
members = ["worker", "importer", "test"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["henius"]

[workspace.dependencies]
worker = { version = "0.9.0", features = ["d1"] }
console_error_panic_hook = "0.1.7"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
reqwest = { version = "0.13.5", features = ["json"] }
tokio = { version = "1.54.1", features = [
  "fs",
  "io-util",
  "macros",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }
zip = { version = "9.8.2", default-features = false, features = [
  "deflate-flate2-zlib-rs",
] }
csv = "1.4.0"

[profile.release]
lto = "fat"
opt-level = 3
codegen-units = 1
panic = "abort"
strip = true

[profile.worker-release]
inherits = "release"
opt-level = "z"
strip = false

[profile.dev.package."*"]
opt-level = 3

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
