openapi: 3.1.0
info:
  title: my-GTFS-worker API
  version: 0.1.0
  summary: Unified Cloudflare Worker API for Malaysian GTFS static transit datasets.
  description: |-
    Serves per-provider GTFS static datasets stored in isolated Cloudflare D1 databases.

    **CORS**: Every response includes `Access-Control-Allow-Origin` from `WORKER_CORS_ALLOW_ORIGIN`. `OPTIONS` preflight requests return `204 No Content` with `Access-Control-Allow-Methods: GET, POST, OPTIONS` and `Access-Control-Allow-Headers: Content-Type, Authorization, X-Admin-Key`.

    **Rate limits**: Exceeding the Cloudflare D1 daily row read limit returns `429 Too Many Requests` with a JSON `ErrorResponse` body.
servers:
  - url: "https://my-gtfs-worker.henius98.workers.dev"
    description: Production Cloudflare Worker
  - url: "http://localhost:8787"
    description: Local Wrangler dev server
tags:
  - name: Health
    description: Worker liveness endpoint.
  - name: Status
    description: GTFS import progress per provider.
  - name: Data
    description: "Paginated, filterable GTFS table queries."
  - name: SQL
    description: Admin-protected read-only SQL queries.
  - name: Map
    description: GeoJSON transit network routes and stops.
paths:
