    get:
      tags: [Health]
      operationId: getHealth
      summary: Worker liveness check
      description: Returns plain text confirming that the Worker is running. Does not query D1.
      responses:
        "200":
          description: Worker is running.
          headers:
            Access-Control-Allow-Origin:
              "$ref": "#/components/headers/CorsAllowOrigin"
          content:
            "text/plain":
              schema:
                type: string
              example: "Worker is running. Use /<provider>/status to check GTFS import progress."
        "500":
          "$ref": "#/components/responses/InternalServerError"
  "/{provider}/status":
    parameters:
      - "$ref": "#/components/parameters/Provider"
    get:
      tags: [Status]
      operationId: getProviderStatus
      summary: Get GTFS import progress for a provider
      description: "Returns all rows from `0_import_progress` for the provider. Canonicalizes cache keys and edge-caches successful responses for `WORKER_API_CACHE_TTL_SECONDS` (currently `60`s)."
      responses:
        "200":
          description: "Import progress records (may be an empty array)."
          headers:
            Access-Control-Allow-Origin:
              "$ref": "#/components/headers/CorsAllowOrigin"
            Cache-Control:
              "$ref": "#/components/headers/CacheControl"
          content:
            "application/json":
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/ImportProgress"
        "404":
          "$ref": "#/components/responses/ProviderNotFound"
        "405":
          "$ref": "#/components/responses/MethodNotAllowedText"
        "429":
          "$ref": "#/components/responses/RateLimitExceeded"
        "500":
          "$ref": "#/components/responses/InternalServerError"
  "/{provider}/data/{table}":
    parameters:
      - "$ref": "#/components/parameters/Provider"
      - "$ref": "#/components/parameters/Table"
    get:
      tags: [Data]
      operationId: listTableRows
      summary: Query rows from a provider table
      description: |-
        Returns paginated rows for any table compiled into the provider's D1 schema. Duplicate query parameter keys return `400`. Column names are resolved case-insensitively.

        Responses set `Cache-Control: public, max-age=60` (from `WORKER_API_CACHE_TTL_SECONDS`).
      parameters:
        - name: limit
          in: query
          required: false
          description: "Maximum rows to return. Values above `WORKER_SQL_MAX_ROWS` (1000) are clamped to 1000."
          schema:
            type: integer
            minimum: 0
            default: 1000
          example: 10
        - name: offset
          in: query
          required: false
          description: Number of rows to skip before returning results.
          schema:
            type: integer
            minimum: 0
            default: 0
          example: 0
        - name: include
          in: query
          required: false
          description: "Comma-separated list of columns to return. Mutually exclusive with `exclude`; must not be empty."
          schema:
            type: string
            minLength: 1
          example: "stop_id,stop_name"
        - name: exclude
          in: query
          required: false
          description: "Comma-separated list of columns to omit. Mutually exclusive with `include`; cannot exclude all columns."
          schema:
            type: string
            minLength: 1
          example: "stop_lat,stop_lon"
        - name: filter
          in: query
          required: false
          description: "Exact case-sensitive match (`=`). Comma-separated `val@col` items; escape literal commas in values with `\\,`."
          schema:
            type: string
          example: KJ10@stop_id
        - name: ifilter
          in: query
          required: false
          description: "Exact case-insensitive match (`COLLATE NOCASE =`). Comma-separated `val@col` items; escape literal commas with `\\,`."
          schema:
            type: string
          example: kj10@stop_id
        - name: contains
          in: query
          required: false
          description: "Case-sensitive substring match (`INSTR(col, val) > 0`). Comma-separated `val@col` items; escape literal commas with `\\,`."
          schema:
            type: string
          example: KJ@stop_id
        - name: icontains
          in: query
          required: false
          description: "Case-insensitive substring match (`LIKE '%val%'`). Comma-separated `val@col` items; escape literal commas with `\\,`."
          schema:
            type: string
          example: sentral@stop_name
        - name: range
          in: query
          required: false
          description: "Inclusive range filter (`>=` / `<=`). Comma-separated `col[begin:end]` or `col[begin..end]` items. Supports open bounds (`col[:end]`, `col[begin:]`) and `HH:MM[:SS]` time values."
          schema:
            type: string
          example: "stop_lat[1:7]"
        - name: sort
          in: query
          required: false
          description: "Comma-separated columns to sort by. Prefix a column with `-` for descending order."
          schema:
            type: string
          example: "stop_name,-stop_id"
