            type: string
            minLength: 1
          example: "KJL,PYL"
        - name: date
          in: query
          required: false
          description: "Service date in `YYYY-MM-DD` or `YYYYMMDD` format. Defaults to today in `Asia/Kuala_Lumpur`."
