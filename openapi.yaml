        Executes one read-only `SELECT` or `WITH ... SELECT` statement wrapped in a subquery capped at `WORKER_SQL_MAX_ROWS` (1000). SQL comments (`--`, `/*`) and multiple statements are rejected; a single trailing semicolon is allowed.

        Requires `WORKER_ADMIN_KEY` via `Authorization: Bearer <key>` or `X-Admin-Key: <key>` (unless `WORKER_ALLOW_ANONYMOUS_SQL=true` or `WORKER_TEST_NOW` is set for local/test environments).
