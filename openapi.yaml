        "405":
          "$ref": "#/components/responses/MethodNotAllowedText"
        "429":
          "$ref": "#/components/responses/RateLimitExceeded"
        "500":
          "$ref": "#/components/responses/InternalServerError"
  "/{provider}/sql":
    parameters:
