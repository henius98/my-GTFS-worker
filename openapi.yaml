              "$ref": "#/components/headers/Allow"
          content:
            "text/plain":
              schema:
                type: string
              example: Method Not Allowed
        "429":
          "$ref": "#/components/responses/RateLimitExceeded"
        "500":
          "$ref": "#/components/responses/InternalServerError"
  "/{provider}/map":
    parameters:
      - "$ref": "#/components/parameters/Provider"
    get:
      tags: [Map]
      operationId: getProviderMap
      summary: Get provider transit network as GeoJSON
      description: |-
        Returns active routes and stops for a service date as a GeoJSON `FeatureCollection`. Providers with a `shapes` table emit `LineString` route features (`geometry_source: "shape"`); providers without shapes (or routes without shape points) fall back to `MultiLineString` stop-to-stop segments (`geometry_source: "stop_sequence"`). Stops emit `Point` features.

        Edge-cached per route until the next daily `WORKER_MAP_CACHE_EXPIRE_TIME` (`05:00` in `Asia/Kuala_Lumpur`); multi-route calls query D1 only for cache misses.
      parameters:
        - name: route_id
          in: query
          required: false
          description: "Optional comma-separated GTFS route identifiers to filter the map (1 to 20 unique routes, each 1 to 256 bytes after trimming). Returns `404` only if zero requested routes have active trips on the target date."
