# providers.toml — Single source of truth for all GTFS provider instances.
#
# After adding a new provider block with an empty `database_id`:
#   1. Run: ./scripts/deploy.sh
#
# The deploy script will automatically provision the D1 database,
# fill in the `database_id`, generate wrangler.toml, and deploy!

# Keep the budget on this provider; moving it requires preserving its ledger.
budget_provider = "ktmb"

[[providers]]
name = "mybas-johor"
is_active = true
static_url = "https://api.data.gov.my/gtfs-static/"
static_provider = "mybas-johor"
database_id = "11578d7b-8e95-4cd2-a9eb-b79c0a34969c"

